<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Juego de Aniversario ❤️</title>
  <script src= "https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  <style>
    body { margin: 0; padding: 0; overflow: hidden; background: #000; }
    canvas { display: block; margin: 0 auto; }
  </style>
</head>
<body>
<script>
const config = {
  type: Phaser.AUTO,
  width: 800,
  height: 600,
  physics: {
    default: 'arcade',
    arcade: { gravity: { y: 300 }, debug: false }
  },
  scene: { preload, create, update }
};

const game = new Phaser.Game(config);
let player, cursors, hearts;

function preload() {
  this.load.image('bg', 'assets/bg.png');
  this.load.image('hearth', 'assets/hearth.png');
  this.load.image('sacate', 'assets/sacate.png');
  this.load.spritesheet('player', 'assets/player.png', { frameWidth: 32, frameHeight: 48 });
}

function create() {
  this.add.image(400, 300, 'bg');

  const platforms = this.physics.add.staticGroup();
  platforms.create(400, 568, 'sacate').setScale(2).refreshBody();

  player = this.physics.add.sprite(100, 450, 'player');
  player.setBounce(0.2);
  player.setCollideWorldBounds(true);

  this.anims.create({
    key: 'left', frames: this.anims.generateFrameNumbers('player', { start: 0, end: 3 }), frameRate: 10, repeat: -1
  });
  this.anims.create({
    key: 'turn', frames: [ { key: 'player', frame: 4 } ], frameRate: 20
  });
  this.anims.create({
    key: 'right', frames: this.anims.generateFrameNumbers('player', { start: 5, end: 8 }), frameRate: 10, repeat: -1
  });

  cursors = this.input.keyboard.createCursorKeys();
  this.physics.add.collider(player, platforms);

  hearts = this.physics.add.group({ key: 'hearth', repeat: 5, setXY: { x: 12, y: 0, stepX: 130 } });
  hearts.children.iterate(child => { child.setBounceY(Phaser.Math.FloatBetween(0.4, 0.8)); });

  this.physics.add.collider(hearts, platforms);
  this.physics.add.overlap(player, hearts, collectHeart, null, this);

  this.messageShown = false;
}

function update() {
  if (cursors.left.isDown) {
    player.setVelocityX(-160);
    player.anims.play('left', true);
  } else if (cursors.right.isDown) {
    player.setVelocityX(160);
    player.anims.play('right', true);
  } else {
    player.setVelocityX(0);
    player.anims.play('turn');
  }

  if (cursors.up.isDown && player.body.touching.down) {
    player.setVelocityY(-330);
  }
}

function collectHeart(player, heart) {
  heart.disableBody(true, true);

  if (hearts.countActive(true) === 0 && !this.messageShown) {
    const text = this.add.text(100, 250, '¡Feliz aniversario, mi amor! ❤️', {
      fontSize: '32px',
      fill: '#fff',
      fontFamily: 'Arial'
    });
    text.setShadow(2, 2, '#000', 2);
    this.messageShown = true;
  }
}
</script>
</body>
</html>
